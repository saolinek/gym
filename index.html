<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fitko Plán</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;600;800&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a1c4fd">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="apple-touch-icon" href="pwa/icon-512.png">
    <style>
        /* === ZÁKLADNÍ NASTAVENÍ === */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            height: 100%;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(120deg, #a1c4fd 0%, #c2e9fb 100%);
            color: #1e293b;
        }

        .screen-content {
            padding: 12px 16px;
            padding-top: 16px;
            padding-bottom: 74px;
            height: 100vh;
            height: 100dvh;
            animation: fadeInPage 0.5s ease-out;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* === GYM APP STYLY (MOBILE DEFAULT) === */
        .gym-cont {
            max-width: 640px;
            margin: 0 auto;
            padding-bottom: 0;
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow: hidden;
        }

        #gym-list,
        #history-list,
        #settings-list {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            min-height: 0;
        }

        .header-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            position: relative;
        }

        .gym-h1 {
            font-size: 1.75rem;
            text-align: center;
            font-weight: 900;
            margin: 0;
            letter-spacing: -1px;
            color: #0f172a;
            line-height: 1;
        }

        .edit-toggle {
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .edit-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
            color: #3b82f6;
        }

        .edit-toggle.active {
            color: #3b82f6;
            background: #e0f2fe;
        }

        .gym-sub {
            text-align: center;
            color: #475569;
            font-size: 0.85rem;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .gym-prog {
            background: #ffffff;
            border-radius: 20px;
            height: 10px;
            overflow: hidden;
            margin-bottom: 4px;
            border: 2px solid #e2e8f0;
        }

        .gym-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            width: 0%;
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gym-cat {
            background: #ffffff;
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 12px;
            border: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        /* Dynamic Category Colors */
        .gym-cat {
            border-top: 5px solid #cbd5e1;
        }

        .gym-cat:nth-of-type(3n+1) {
            border-top-color: #0284c7;
        }

        .gym-cat:nth-of-type(3n+1) h2 {
            color: #0284c7;
        }

        .gym-cat:nth-of-type(3n+2) {
            border-top-color: #7c3aed;
        }

        .gym-cat:nth-of-type(3n+2) h2 {
            color: #7c3aed;
        }

        .gym-cat:nth-of-type(3n+3) {
            border-top-color: #059669;
        }

        .gym-cat:nth-of-type(3n+3) h2 {
            color: #059669;
        }

        .gym-item {
            display: flex;
            align-items: center;
            padding: 12px;
            margin-bottom: 6px;
            background: #f8fafc;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
            position: relative;
        }

        .gym-item.checked {
            background: #f0fdf4;
            border-color: #86efac;
        }

        .gym-item.checked span {
            text-decoration: line-through;
            color: #94a3b8;
        }

        /* Locked state for past day completions */
        .gym-item.locked {
            opacity: 0.6;
            cursor: default;
            pointer-events: none;
        }

        .gym-item.locked .gym-box {
            background: #94a3b8;
            border-color: #94a3b8;
        }

        .gym-box {
            width: 26px;
            height: 26px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: #ffffff;
            margin-right: 14px;
            position: relative;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .gym-item.checked .gym-box {
            background: #22c55e;
            border-color: #22c55e;
            transform: rotate(360deg);
        }

        .gym-item.checked .gym-box::after {
            content: '✓';
            color: white;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
        }

        /* Edit Mode Styles */
        .edit-controls {
            display: flex;
            gap: 8px;
            margin-left: auto;
        }

        .icon-btn {
            padding: 6px;
            border-radius: 6px;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .del-btn {
            color: #ef4444;
        }

        .del-btn:hover {
            background: #fee2e2;
        }

        .add-btn {
            width: 100%;
            text-align: center;
            padding: 12px;
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            color: #64748b;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
        }

        .add-btn:hover {
            border-color: #94a3b8;
            color: #475569;
            background: #f8fafc;
        }

        .cat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        /* === DRAG AND DROP === */
        .drag-handle {
            cursor: grab;
            padding: 4px 8px 4px 0;
            color: #94a3b8;
            display: flex;
            align-items: center;
            touch-action: none;
            flex-shrink: 0;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .dragging-source {
            opacity: 0.3 !important;
        }

        .drag-ghost {
            pointer-events: none !important;
            z-index: 9999 !important;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25) !important;
            transform: scale(1.02) rotate(0.5deg) !important;
            transition: none !important;
        }

        .drop-indicator {
            height: 3px;
            background: #3b82f6;
            border-radius: 2px;
            margin: 4px 0;
            pointer-events: none;
        }

        /* Particle & Reset */
        .particle {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
        }

        @keyframes particle-burst {
            to {
                transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg);
                opacity: 0;
            }
        }

        /* Task Completion Animation - Smooth Bounce */
        .gym-item.just-checked {
            animation: taskComplete 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes taskComplete {
            0% {
                transform: scale(1);
            }

            40% {
                transform: scale(1.06);
            }

            70% {
                transform: scale(0.98);
            }

            100% {
                transform: scale(1);
            }
        }

        .google-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: white;
            color: #64748b;
            border: 1px solid #e2e8f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            margin: 0 auto;
            width: auto;
            transition: all 0.2s;
        }

        .google-btn:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
        }

        .google-btn img {
            width: 14px;
            height: 14px;
            margin-right: 6px;
        }

        .user-status {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 8px;
            text-align: center;
        }

        /* === STYLY PRO HISTORII A GRAFY === */
        .history-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-date {
            font-weight: 700;
            color: #334155;
            font-size: 0.95rem;
        }

        .history-stats {
            text-align: right;
        }

        .history-perc {
            font-weight: 800;
            color: #3b82f6;
            font-size: 1.1rem;
        }

        .history-count {
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chart-box {
            background: white;
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .chart-title {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            font-size: 1.1rem;
        }

        /* === SPODNÍ NAVIGACE === */
        #bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
            width: 33.33%;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            stroke-width: 2.5;
        }

        .nav-item.active {
            color: #3b82f6;
        }

        .app-version {
            text-align: center;
            color: #94a3b8;
            font-size: 0.7rem;
            margin-top: 20px;
            opacity: 0.6;
        }



        /* === MATERIAL YOU THEME (Default, colorful) === */
        body.theme-material {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 50%, #fbc2eb 100%);
        }

        body.theme-material .gym-cat {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        body.theme-material .gym-cat:nth-of-type(3n+1) {
            border-top-color: #0284c7;
        }

        body.theme-material .gym-cat:nth-of-type(3n+1) h2 {
            color: #0284c7;
        }

        body.theme-material .gym-cat:nth-of-type(3n+2) {
            border-top-color: #7c3aed;
        }

        body.theme-material .gym-cat:nth-of-type(3n+2) h2 {
            color: #7c3aed;
        }

        body.theme-material .gym-cat:nth-of-type(3n+3) {
            border-top-color: #059669;
        }

        body.theme-material .gym-cat:nth-of-type(3n+3) h2 {
            color: #059669;
        }

        body.theme-material .gym-fill {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
        }

        body.theme-material .nav-item.active {
            color: #3b82f6;
        }



        /* Month View Styles */
        .day-cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 1rem;
            cursor: default;
            color: #1e293b;
            border: 2px solid transparent;
        }

        .day-cell.active {
            background: #dbeafe;
            color: #1d4ed8;
            font-weight: 700;
        }

        .day-cell.today {
            border-color: #3b82f6;
        }



        /* Updated Completion Style */
        .gym-item.checked {
            background: rgba(255, 255, 255, 0.6);
            border-color: #cbd5e1;
            opacity: 0.7;
        }

        .gym-item.checked span {
            text-decoration: line-through;
            text-decoration-thickness: 1px;
            color: #94a3b8;
        }

        /* Settings View */
        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 12px;
            margin-bottom: 6px;
            border: 1px solid #e2e8f0;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: #3b82f6;
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }

        /* === SEGMENTED CONTROL (View Mode) === */
        .segmented-control {
            display: flex;
            background: #e2e8f0;
            border-radius: 10px;
            padding: 3px;
            gap: 3px;
        }

        .seg-btn {
            flex: 1;
            padding: 7px 16px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.18s, color 0.18s, box-shadow 0.18s;
            white-space: nowrap;
            letter-spacing: 0.01em;
        }

        .seg-btn.active {
            background: white;
            color: #1e293b;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.14);
        }

        /* === CARDS VIEW LAYOUT === */
        #gym-list.view-cards {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            scroll-behavior: smooth;
            overscroll-behavior-x: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
            gap: 12px;
            align-items: flex-start;
        }

        #gym-list.view-cards::-webkit-scrollbar {
            display: none;
        }

        #gym-list.view-cards .gym-cat {
            flex: 0 0 calc(100% - 12px);
            scroll-snap-align: start;
            scroll-snap-stop: always;
            margin-bottom: 0;
            overflow-y: auto;
            max-height: 100%;
        }

        /* === DOTS INDICATOR === */
        #dots-indicator {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 10px 0 4px;
        }

        #dots-indicator .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #cbd5e1;
            transition: width 0.25s ease, border-radius 0.25s ease, background 0.2s;
        }

        #dots-indicator .dot.active {
            width: 20px;
            border-radius: 3.5px;
            background: #3b82f6;
        }

        /* Year View Styles */
        .prog-track {
            background: #f1f5f9;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }



        /* === HISTORY EDITOR MODAL === */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10001;
            display: none;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 16px;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        body.dark-mode .modal-content {
            background: #1e293b;
            color: #f1f5f9;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-date-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        body.dark-mode .modal-date-input {
            background: #334155;
            border-color: #475569;
            color: #f1f5f9;
        }

        .history-cat-title {
            font-weight: 700;
            color: #64748b;
            font-size: 0.85rem;
            margin: 12px 0 8px;
        }

        .history-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #f8fafc;
            border-radius: 10px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        body.dark-mode .history-item {
            background: #334155;
        }

        .history-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: #22c55e;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
        }

        .modal-btn-save {
            background: #22c55e;
            color: white;
        }

        .modal-btn-close {
            background: #e2e8f0;
            color: #475569;
        }

        body.dark-mode .modal-btn-close {
            background: #475569;
            color: #f1f5f9;
        }

        /* === DARK MODE (GLOBAL OVERRIDES) === */
        body.dark-mode {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
        }

        body.dark-mode .gym-h1 {
            color: #f1f5f9;
        }

        body.dark-mode .gym-sub,
        body.dark-mode .user-status,
        body.dark-mode .app-version {
            color: #94a3b8;
        }

        body.dark-mode .gym-item {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }

        body.dark-mode .gym-item.checked {
            background: rgba(30, 41, 59, 0.6);
            border-color: #334155;
        }

        body.dark-mode .gym-item.checked span {
            color: #64748b;
        }

        body.dark-mode .gym-box {
            background: #0f172a;
            border-color: #475569;
        }

        body.dark-mode .gym-cat {
            background: #1e293b;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* Material Dark Overrides */
        body.dark-mode.theme-material .gym-cat {
            background: #1e293b;
            border-top-width: 4px;
        }

        body.dark-mode.theme-material .gym-cat:nth-of-type(3n+1) h2 {
            color: #38bdf8;
        }

        body.dark-mode.theme-material .gym-cat:nth-of-type(3n+1) {
            border-top-color: #38bdf8;
        }

        body.dark-mode.theme-material .gym-cat:nth-of-type(3n+2) h2 {
            color: #a78bfa;
        }

        body.dark-mode.theme-material .gym-cat:nth-of-type(3n+2) {
            border-top-color: #a78bfa;
        }

        body.dark-mode.theme-material .gym-cat:nth-of-type(3n+3) h2 {
            color: #34d399;
        }

        body.dark-mode.theme-material .gym-cat:nth-of-type(3n+3) {
            border-top-color: #34d399;
        }



        body.dark-mode #bottom-nav {
            background: rgba(15, 23, 42, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Dark Mode Components */
        body.dark-mode .settings-item,
        body.dark-mode .history-card,
        body.dark-mode .chart-box {
            background: #1e293b;
            border-color: #334155;
            color: #f1f5f9;
        }



        body.dark-mode .theme-btn {
            background: #0f172a;
            border-color: #334155;
            color: #94a3b8;
        }

        body.dark-mode .segmented-control {
            background: #0f172a;
        }

        body.dark-mode .seg-btn {
            color: #475569;
        }

        body.dark-mode .seg-btn.active {
            background: #1e293b;
            color: #f1f5f9;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        body.dark-mode #dots-indicator .dot {
            background: #334155;
        }

        body.dark-mode #dots-indicator .dot.active {
            background: #60a5fa;
        }

        body.dark-mode .theme-btn.active {
            background: #1e293b;
            border-color: #3b82f6;
            color: #60a5fa;
        }

        body.dark-mode .chart-title,
        body.dark-mode .history-date {
            color: #f1f5f9;
        }

        body.dark-mode .add-btn {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #94a3b8 !important;
        }

        body.dark-mode .google-btn {
            background: #0f172a;
            border-color: #334155;
            color: #cbd5e1;
        }

        body.dark-mode .google-btn:hover {
            background: #1e293b;
        }

        body.dark-mode .day-cell {
            color: #cbd5e1;
        }

        body.dark-mode .day-cell.active {
            background: #1e3a8a;
            color: #60a5fa;
        }

        body.dark-mode .day-cell.today {
            border-color: #60a5fa;
        }

        body.dark-mode .nav-item {
            color: #64748b;
        }

        body.dark-mode .nav-item.active {
            color: #60a5fa;
        }

        body.dark-mode .modal-content {
            background: #1e293b;
            color: #f1f5f9;
        }

        body.dark-mode .modal-date-input {
            background: #0f172a;
            border-color: #334155;
            color: #f1f5f9;
        }

        /* === DESKTOP LAYOUT (>= 1024px) === */
        @media (min-width: 1024px) {
            .gym-cont {
                max-width: 1024px;
            }

            #gym-list {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 24px;
                align-items: start;
            }

            .gym-cat {
                margin-bottom: 0;
                height: 100%;
            }

            #edit-controls-main {
                grid-column: 1 / -1;
            }

            #history-list {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 16px;
            }

            #bottom-nav {
                width: auto;
                min-width: 400px;
                left: 50%;
                transform: translateX(-50%);
                bottom: 24px;
                border-radius: 50px;
                border: 1px solid rgba(255, 255, 255, 0.5);
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
                padding: 0 32px;
            }

            .screen-content {
                padding-bottom: 100px;
            }
        }
    </style>
</head>

<body>
    <div class="screen-content">
        <!-- ZÁLOŽKA DEN (ex PLAN) -->
        <div id="view-day" class="gym-cont">
            <div class="header-row">
                <h1 class="gym-h1">Dnes</h1>
                <button class="edit-toggle" id="edit-btn" onclick="toggleEditMode()" title="Upravit plán">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
            <div class="gym-sub">Tvůj dnešní trénink</div>

            <div class="gym-prog">
                <div id="gym-bar" class="gym-fill"></div>
            </div>
            <div id="gym-text" style="text-align: center; font-size: 13px; margin-bottom: 8px; font-weight: 600;">0 / 0
            </div>

            <div id="gym-list"></div>
            <div id="dots-indicator"></div>
            <div id="edit-controls-main" style="display:none; text-align:center; margin-top:16px;">
                <div class="add-btn" onclick="addCategory()"
                    style="background: white; border: 2px dashed #94a3b8; color: #1e293b;">+ Přidat novou kategorii
                </div>
            </div>
        </div>

        <!-- ZÁLOŽKA TÝDEN (ex HISTORY) -->
        <div id="view-week" class="gym-cont" style="display: none;">
            <h1 class="gym-h1">Týden</h1>
            <div class="gym-sub">Přehled týdenní aktivity</div>
            <div style="text-align: center; margin-bottom: 24px; color: #64748b; font-size: 0.9rem;">
                <span id="current-week-date" style="font-weight: 700; color: #334155;"></span>
            </div>
            <div id="history-list"></div>
        </div>


        <!-- ZÁLOŽKA NASTAVENÍ (NEW) -->
        <div id="view-settings" class="gym-cont" style="display: none; padding-bottom: 0;">
            <h1 class="gym-h1">Nastavení</h1>
            <div class="gym-sub" style="margin-bottom: 16px;">Předvolby aplikace</div>
            <div id="settings-list"></div>
            <div class="app-version" id="app-ver-display"></div>

    </div>

    <!-- SPODNÍ NAVIGACE -->
    <nav id="bottom-nav">

                <polyline points="14 2 14 8 20 8"></polyline>

                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
            <span>Den</span>
        </div>
        <div class="nav-item" id="nav-btn-week" onclick="switchTab('week')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>

        <div class="nav-item" id="nav-btn-settings" onclick="switchTab('settings')">

                stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">

    <!-- HISTORY EDITOR MODAL -->
    <div id="history-modal" class="modal-overlay" onclick="if(event.target === this) closeHistoryEditor()">
        <div class="modal-content">
            <div class="modal-title">Upravit historii</div>
            <input type="date" id="history-date" class="modal-date-input" onchange="loadDateExercises()">
            <div id="history-exercises"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-save" onclick="saveHistoryEdit()">Uložit</button>
                <button class="modal-btn modal-btn-close" onclick="closeHistoryEditor()">Zavřít</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // Listen for SW update messages
            navigator.serviceWorker.addEventListener('message', (event) => {
                if (event.data && event.data.type === 'SW_UPDATED') {
                    console.log('[App] New version available:', event.data.version);
                    // Reload to get the new version
                    window.location.reload();
                }
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);

                        // Check for updates every time app is loaded
                        registration.update();

                        // Listen for new waiting service worker
                        registration.addEventListener('updatefound', () => {
                            const newWorker = registration.installing;
                            console.log('[App] New service worker installing...');

                            newWorker.addEventListener('statechange', () => {
                                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                    console.log('[App] New version ready, reloading...');
                                    window.location.reload();
                                }
                            });
                        });
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });

            // Handle controller change (when new SW takes over)
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                console.log('[App] Controller changed, reloading...');
                window.location.reload();
            });
        }
    </script>
</body>

</html>
